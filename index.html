<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4a35">
<link rel="manifest" href="manifest.webmanifest">
<title>Suivi Kuroiler</title>
<style>
:root{--ink:#1f2420;--green:#1d4a35;--leaf:#dce8dc;--sun:#f0b429;--bg:#f5f8f5;--red:#b3261e;--line:#c9d6c9}
@media (prefers-color-scheme:dark){:root{--ink:#e8efe8;--green:#0f2a1e;--leaf:#243a2d;--bg:#141b16;--line:#33473a;--red:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
#hero{background:var(--green);color:#fff;padding:20px 16px 18px}
#hero .day{font:700 64px/1 ui-serif,Georgia,serif;color:var(--sun)}
#hero .day small{font-size:22px;color:#fff;font-weight:400}
#hero p{margin:4px 0 0}
main{max-width:640px;margin:0 auto;padding:0 16px 90px}
section{padding:18px 0;border-bottom:1px solid var(--line)}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:14px;margin:8px 0 2px}
input,textarea,button{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{background:var(--green);color:#fff;border:0;font-weight:600;margin-top:12px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{width:auto;padding:4px 10px;margin:0 0 0 4px;font-size:13px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun)}
#alert .a{background:var(--red);color:#fff;padding:10px 12px;border-radius:6px;margin-bottom:8px}
[hidden]{display:none!important}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.it.h{font-weight:700;border-bottom:2px solid var(--green);margin-top:12px}
.neg{color:var(--red)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
li input{width:22px;height:22px;margin-top:2px;flex:none}
li.due b{color:var(--red)}
li.ok{opacity:.55;text-decoration:line-through}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{white-space:normal;min-width:120px}
.muted{opacity:.7;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--green)}
nav button{margin:0;border-radius:0;background:transparent;color:#fff;padding:14px 4px}
nav button[aria-current=true]{background:var(--sun);color:#222}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--sun);color:#222;padding:8px 16px;border-radius:20px;font-weight:600;display:none}
</style>
</head>
<body>
<header id="hero"></header>
<main>

<div id="tab-suivi">
<section id="alert"></section>
<section id="age"></section>
<section>
<h2>Saisie du jour</h2>
<form id="f">
<label for="date">Date</label>
<input type="date" id="date" name="date" required>
<p class="muted" id="agej"></p>
<div class="row">
<div><label for="morts">Morts</label><input type="number" id="morts" name="morts" min="0" inputmode="numeric"></div>
<div><label for="temp">Température (°C)</label><input type="number" id="temp" name="temp" step="0.1" inputmode="decimal"></div>
<div><label for="feedg">Aliment donné (g)</label><input type="number" id="feedg" name="feedg" min="0" inputmode="numeric"></div>
<div><label for="poids">Poids moyen (g)</label><input type="number" id="poids" name="poids" min="0" inputmode="numeric"></div>
</div>
<label for="note">Observation (fientes, plumes, comportement)</label>
<textarea id="note" name="note" rows="2"></textarea>
<button type="submit">Enregistrer</button>
</form>
</section>
<section>
<h2>À faire</h2>
<ul id="tasks"></ul>
<p class="muted">Vaccins : confirme les dates avec ton vétérinaire.</p>
</section>
<section>
<h2>Historique</h2>
<div class="scroll"><table id="hist"></table></div>
</section>
</div>

<div id="tab-finance" hidden>
<section>
<h2>Situation financière</h2>
<div id="fin"></div>
</section>
<section>
<h2>Dépenses</h2>
<form id="fd">
<div class="row">
<div><label for="fd-date">Date</label><input type="date" id="fd-date" name="date" required></div>
<div><label for="fd-montant">Montant (F)</label><input type="number" id="fd-montant" name="montant" min="0" inputmode="numeric" required></div>
</div>
<label for="fd-label">Dépense</label>
<input type="text" id="fd-label" name="label" placeholder="ex : aliment démarrage" required>
<button type="submit" class="go">Ajouter la dépense</button>
<button type="button" class="alt cancel" hidden>Annuler la modification</button>
</form>
<div id="deps"></div>
</section>
<section>
<h2>Ventes</h2>
<form id="fv">
<div class="row">
<div><label for="fv-date">Date</label><input type="date" id="fv-date" name="date" required></div>
<div><label for="fv-nb">Oiseaux vendus</label><input type="number" id="fv-nb" name="nb" min="0" inputmode="numeric"></div>
</div>
<label for="fv-montant">Montant total (F)</label>
<input type="number" id="fv-montant" name="montant" min="0" inputmode="numeric" required>
<label for="fv-label">Vente</label>
<input type="text" id="fv-label" name="label" placeholder="ex : poulets vifs, fientes" required>
<button type="submit" class="go">Ajouter la vente</button>
<button type="button" class="alt cancel" hidden>Annuler la modification</button>
</form>
<div id="ventes"></div>
</section>
</div>

<div id="tab-rapport" hidden>
<section>
<h2>Rapport général</h2>
<div id="rapport"></div>
<button type="button" id="copy">Copier le rapport</button>
</section>
<section>
<h2>Réglages</h2>
<div class="row">
<div><label for="start">Date d'arrivée (J0)</label><input type="date" id="start"></div>
<div><label for="initial">Nombre de poussins</label><input type="number" id="initial" min="1" inputmode="numeric"></div>
</div>
<label for="capital">Capital de départ (F)</label>
<input type="number" id="capital" min="0" inputmode="numeric">
<button type="button" class="alt" id="exp">Sauvegarder (fichier)</button>
<button type="button" class="alt" id="imp">Restaurer une sauvegarde</button>
<input type="file" id="file" accept="application/json" hidden>
</section>
</div>

</main>
<nav>
<button type="button" data-t="suivi" aria-current="true">Suivi</button>
<button type="button" data-t="finance">Finance</button>
<button type="button" data-t="rapport">Rapport</button>
</nav>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
